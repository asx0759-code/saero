<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>前田 陸 (@horizontal)</title>
<style>
:root{--bg:#fff;--text:#0f1419;--sub:#536471;--acc:#1d9bf0;--line:#eff3f4;--soft:#f7f9f9;--red:#f91880;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--text:#e7e9ea;--sub:#71767b;--line:#2f3336;--soft:#16181c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--text:#e7e9ea;--sub:#71767b;--line:#2f3336;--soft:#16181c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{height:100%;max-width:480px;margin:0 auto;display:none;flex-direction:column}
#main{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg)}
#main.off{display:none}
.ban{display:block;width:100%;height:117px;object-fit:cover;background:#1d9bf0}
.pt{position:relative;height:50px}
.pav{position:absolute;left:16px;top:-42px;width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:var(--line)}
.pbtn{position:absolute;right:16px;top:12px;display:flex;gap:10px}
.rb{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center}
.rb svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pi{padding:12px 16px 0}
.pn{font-size:22px;font-weight:800}
.ph{color:var(--sub);font-size:15px;margin-top:2px}
.pb{margin-top:16px;font-size:15px;line-height:1.4}
.pj{margin-top:12px;color:var(--sub);font-size:14px;display:flex;align-items:center;gap:6px}
.pj svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:18px;background:var(--line);border-top:1px solid var(--line)}
.cell{aspect-ratio:1;border:none;padding:0;background:none;display:block;overflow:hidden;position:relative}
.cell img,.cell svg{width:100%;height:100%;object-fit:cover;display:block}
button.cell{cursor:pointer}
#app.on{display:flex}
.pg{display:none;height:100%;max-width:480px;margin:0 auto;flex-direction:column;background:var(--bg)}
.pg.on{display:flex}
.sc{flex:1;overflow-y:auto}
.comp2{display:none;padding:12px 16px;border-bottom:1px solid var(--line);flex-direction:column;gap:8px;background:var(--soft)}
.comp2.on{display:flex}
.rowb{display:flex;align-items:center;gap:10px}
.st{font-size:13px;color:var(--sub);min-height:16px}
.tk,.pp{padding:14px 16px;border-bottom:1px solid var(--line)}
.tk b{font-size:15px}.tk small,.pp small{color:var(--sub);font-size:12px;margin-left:8px}
.row2{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.th{position:relative;flex:0 0 38%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.th video,.th img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.th .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px}
.th.sq{aspect-ratio:1/1}
.th.sq img,.th.sq video{object-fit:cover}
.th.wd{aspect-ratio:16/9}
.th.wd video{object-fit:cover}
.dur{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.rt{flex:1;min-width:0}
.tt{font-size:15px;line-height:1.45;font-weight:400;word-break:break-word;white-space:pre-wrap}
.tt.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mt{margin-top:6px;font-size:13px;color:var(--sub)}
.ex{padding:0 14px 12px}
.ex video,.ex img{width:100%;display:block;border-radius:14px;background:#000;max-height:70vh;object-fit:contain}
.ex audio{width:100%}
.ex iframe{width:100%;border:0;border-radius:14px;display:block}
.ex iframe.yt{aspect-ratio:16/9}
.ex iframe.sc{height:166px}
.th.wd img{object-fit:cover}
.banw{position:relative;height:117px;overflow:hidden;background:#1d9bf0}
.scene{position:absolute;left:50%;top:0;width:480px;height:117px;transform:translateX(-50%)}
.scene .ban{width:480px;height:117px}
#alogin{position:absolute;left:142px;top:65px;width:56px;height:40px;background:transparent;border:0;padding:0;margin:0;cursor:default;-webkit-tap-highlight-color:transparent;outline:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;text-align:center}
.tk iframe{width:100%;border:0;border-radius:12px;margin-top:8px;display:block}
.tk iframe.yt{aspect-ratio:16/9}
.tk iframe.sc{height:166px}
.tk .ol{display:inline-block;margin-top:6px;font-size:12px;color:var(--acc)}
.pp img{width:100%;display:block;border-radius:14px;border:1px solid var(--line)}
.pp .t{margin-top:8px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}


header{display:flex;align-items:center;padding:12px 14px;position:relative;border-bottom:1px solid var(--line)}
header svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:2.4}
header h1{position:absolute;left:0;right:0;text-align:center;font-size:17px;margin:0;pointer-events:none}
#scroll{flex:1;overflow-y:auto}
.pad{padding:14px 16px 0}
.prof{display:flex;align-items:center;gap:12px}
.prof svg.av{width:48px;height:48px;border-radius:50%;flex:none}
.nm{font-weight:700;font-size:16px;line-height:1.2}
.hd{color:var(--sub);font-size:14px}
.badge{margin-left:auto;font-size:11px;background:var(--acc);color:#fff;border-radius:10px;padding:2px 8px}
.photo{width:100%;display:block;border-radius:16px;border:1px solid var(--line);margin-top:14px}
.when{color:var(--sub);font-size:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.likes{padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub)}
.likes b{color:var(--text);font-size:15px}
.acts{display:flex;justify-content:space-around;padding:10px 0;border-bottom:1px solid var(--line)}
.ab{background:none;border:none;color:var(--sub);display:flex;align-items:center;gap:6px;font-size:14px;padding:6px 18px}
.ab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.ab.on{color:var(--red)}.ab.on svg{fill:var(--red);stroke:var(--red)}
.cf{display:none;padding:12px 16px;border-bottom:1px solid var(--line);flex-direction:column;gap:8px;background:var(--soft)}
.cf.open{display:flex}
.cf .r{display:flex;gap:8px}.cf .r input{flex:0 0 34%}
textarea,input{width:100%;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;font-family:inherit}
textarea{resize:none}
.btn{border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:700;padding:9px 18px;border-radius:20px}
.btn:disabled{opacity:.5}.btn.gh{background:var(--line);color:var(--text)}.btn.sm{align-self:flex-end}
.cm{padding:12px 16px;border-bottom:1px solid var(--line)}
.ch{display:flex;gap:10px}
.ini{width:36px;height:36px;border-radius:50%;background:#7856ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cb{flex:1;min-width:0}
.av2{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;background:#fff;border:1px solid var(--line)}
.cb .n{font-size:14px;font-weight:700}.cb .n small{color:var(--sub);font-weight:400;margin-left:6px}
.cb .t{font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.rp{display:flex;gap:10px;margin:10px 0 0 46px;padding-top:10px;border-top:1px dashed var(--line)}
.prof img.av{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover}
.rp img{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover}
.rp svg{width:30px;height:30px;border-radius:50%;flex:none}
.link{background:none;border:none;color:var(--acc);font-size:13px;padding:6px 12px 0 0}
.link.del{color:#e5484d}
.rbox{margin:8px 0 0 46px;display:flex;flex-direction:column;gap:6px}
.empty{padding:40px 20px;color:var(--sub);font-size:14px;text-align:center}
</style>
</head>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const CFG={apiKey:"AIzaSyCXsKG_6nPwCeeRCI36EI5l9gdL9wRaTpE",authDomain:"saerojinro.firebaseapp.com",projectId:"saerojinro",storageBucket:"saerojinro.firebasestorage.app",messagingSenderId:"607420482568",appId:"1:607420482568:web:ed646685f887893e5bfdbd"}, ADMIN='asx0759@gmail.com';
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
let uid=null,isAdmin=false,comments=[],replies={},likes={},tracks=[],letters=[];
let nick='';try{nick=localStorage.getItem('nick')||''}catch(e){}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const bytes=s=>new TextEncoder().encode(s).length;
function ask(b,fn){if(b.dataset.arm){clearTimeout(b._t);b.dataset.arm='';b.textContent=b.dataset.o;fn();return}
 b.dataset.o=b.textContent;b.dataset.arm='1';b.textContent='한 번 더 누르면 삭제돼요';b._t=setTimeout(()=>{b.dataset.arm='';b.textContent=b.dataset.o},3000)}
const DEFAULT_AV='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#dfe3e6"/><circle cx="50" cy="40" r="17" fill="#738390"/><path d="M18 100C18 76 32 64 50 64S82 76 82 100Z" fill="#738390"/></svg>');
function avatar(){const d=document.createElement('img');d.className='av2';d.alt='';d.src=DEFAULT_AV;return d}
const CAT=document.querySelector('.av').outerHTML.replace('class="av"','');
const busy=c=>{const a=document.activeElement;return a&&c.contains(a)&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')};
let dirty=new Set(),wasAdmin=false;
function toast(m){const d=el('div','toast',m);document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty.size){const f=[...dirty];dirty.clear();f.forEach(x=>x())}},150));

/* routing */
const M=$('main'),views={tweet:$('app'),rtt:$('musicPg'),letters:$('photoPg')};
function route(){const v=location.hash.slice(1);
 Object.values(views).forEach(x=>x.classList.remove('on'));
 if(views[v]){M.classList.add('off');views[v].classList.add('on');window.scrollTo(0,0)}else M.classList.remove('off')}
addEventListener('hashchange',route);route();
const go=h=>()=>{location.hash=h},back=()=>{location.hash=''};
$('open1').onclick=go('tweet');$('open2').onclick=go('rtt');$('open3').onclick=go('letters');
$('back').onclick=back;$('back2').onclick=back;$('back3').onclick=back;

/* auth */
onAuthStateChanged(auth,u=>{
 if(!u){signInAnonymously(auth).catch(e=>console.error(e));return}
 uid=u.uid;isAdmin=!u.isAnonymous&&u.email===ADMIN;
 if(isAdmin&&!wasAdmin)toast('관리자로 로그인했어요');wasAdmin=isAdmin;
 $('mcomp').classList.toggle('on',isAdmin);$('pcomp').classList.toggle('on',isAdmin);
 renderDetail();renderTracks();renderLetters()});
$('alogin').onclick=async()=>{
 if(isAdmin){if(confirm('관리자 로그아웃할까요?')){await signOut(auth);toast('로그아웃했어요')}return}
 const p=new GoogleAuthProvider();
 try{await signInWithPopup(auth,p)}catch(e){
  if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){signInWithRedirect(auth,p);return}
  if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('로그인하지 못했어요: '+(e.code||e.message));return}
 if(auth.currentUser&&auth.currentUser.email!==ADMIN){alert('관리자 계정이 아니에요.');await signOut(auth)}};

/* tweet page */
$('bb').onclick=()=>{$('cf').classList.toggle('open');if($('cf').classList.contains('open'))($('ni').value?$('ti'):$('ni')).focus()};
$('ni').value=nick;
$('hb').onclick=()=>{if(!uid)return;const r=doc(db,'likes',uid);(likes[uid]?deleteDoc(r):setDoc(r,{ts:Date.now()})).catch(e=>alert('처리하지 못했어요.'))};
$('sb').onclick=()=>{
 const t=$('ti').value.trim(),n=$('ni').value.trim();
 if(!uid){alert('잠시 후 다시 시도해 주세요.');return}
 if(!n){$('ni').focus();return}if(!t){$('ti').focus();return}
 nick=n;try{localStorage.setItem('nick',n)}catch(e){}
 const b=$('sb');b.disabled=true;
 addDoc(collection(db,'comments'),{nick:n,uid,text:t,ts:Date.now()}).then(()=>{$('ti').value='';$('cf').classList.remove('open')}).catch(()=>alert('댓글을 남기지 못했어요.')).finally(()=>b.disabled=false)};
function openReply(c,m,rp){
 if(c.querySelector('.rbox'))return;
 const b=el('div','rbox'),t=el('textarea');t.rows=2;t.maxLength=500;t.placeholder='답글 입력';t.value=rp?rp.text:'';
 const row=el('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end';
 const x=el('button','btn gh','취소');x.onclick=()=>b.remove();
 const ok=el('button','btn','저장');
 ok.onclick=()=>{const v=t.value.trim();ok.disabled=true;const ref=doc(db,'replies',m.id);
  (v?setDoc(ref,{text:v,ts:Date.now()}):deleteDoc(ref)).catch(()=>{alert('저장하지 못했어요.');ok.disabled=false})};
 row.append(x,ok);b.append(t,row);c.appendChild(b);t.focus()}
function renderDetail(){
 $('lc').textContent=Object.keys(likes).length;
 $('hb').classList.toggle('on',!!(uid&&likes[uid]));
 $('cc').textContent=comments.length||'';
 $('role').textContent='';if(isAdmin){$('role').appendChild(el('span','badge','관리자'));$('role').style.marginLeft='auto'}
 const cl=$('cl');if(busy(cl)){dirty.add(renderDetail);return}
 cl.textContent='';
 if(!comments.length){cl.appendChild(el('div','empty','첫 댓글을 남겨보세요. 💬'));return}
 comments.forEach(m=>{
  const c=el('div','cm'),n=String(m.nick||'익명'),h=el('div','ch');
  h.appendChild(avatar(m.id));
  const b=el('div','cb'),nn=el('div','n',n);nn.appendChild(el('small',null,fmt(m.ts)));b.append(nn,el('div','t',String(m.text||'')));h.appendChild(b);c.appendChild(h);
  const rp=replies[m.id];
  if(rp){const r=el('div','rp');r.innerHTML=CAT;const rb=el('div','cb'),rn=el('div','n','前田 陸');rn.appendChild(el('small',null,'@horizontal · '+fmt(rp.ts)));rb.append(rn,el('div','t',String(rp.text||'')));r.appendChild(rb);c.appendChild(r)}
  if(isAdmin){
   const row=el('div');row.style.marginLeft='46px';
   const b1=el('button','link',rp?'답글 수정':'답글 달기');b1.onclick=()=>openReply(c,m,rp);
   const b2=el('button','link del','삭제');
   b2.onclick=()=>ask(b2,()=>deleteDoc(doc(db,'comments',m.id)).then(()=>deleteDoc(doc(db,'replies',m.id))).catch(()=>alert('삭제하지 못했어요.')));
   row.append(b1,b2);c.appendChild(row)}
  cl.appendChild(c)})}

/* shared list row */
function mkItem(thumb,title,meta,toggle,del,clamp){
 const it=el('div','it'),r=el('div','row2');
 if(thumb){const th=el('div','th'+(thumb.cls?' '+thumb.cls:''));th.appendChild(thumb.node);r.appendChild(th)}
 const rt=el('div','rt');rt.append(el('div','tt'+(clamp?' cl':''),title),el('div','mt',meta));
 if(del){const d=el('button','link del','삭제');d.style.cssText='padding:6px 0 0;display:block';
  d.onclick=e=>{e.stopPropagation();ask(d,del)};rt.appendChild(d)}
 r.appendChild(rt);it.appendChild(r);
 if(toggle){r.style.cursor='pointer';let slot=null;r.onclick=()=>{if(slot){slot.remove();slot=null;return}slot=el('div','ex');toggle(slot);it.appendChild(slot)}}
 return it}

/* RTT (links) */
function parseLink(u){let x;try{x=new URL(u.trim())}catch(e){return null}
 if(x.protocol!=='https:')return null;
 const h=x.hostname.replace(/^www\.|^m\./,''),ID=/^[\w-]{11}$/;
 if(h==='youtu.be'){const id=x.pathname.slice(1);return ID.test(id)?{kind:'yt',ref:id}:null}
 if(h==='youtube.com'||h==='music.youtube.com'){
  const v=x.searchParams.get('v'),l=x.searchParams.get('list'),sp=x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);
  if(v&&ID.test(v))return{kind:'yt',ref:v};if(sp)return{kind:'yt',ref:sp[1]};
  if(l&&/^[\w-]+$/.test(l))return{kind:'ytl',ref:l};return null}
 if(h==='soundcloud.com'||h==='on.soundcloud.com')return{kind:'sc',ref:'https://'+x.hostname+x.pathname};
 return null}
function embedOf(t){
 if(t.kind==='yt'&&/^[\w-]{11}$/.test(t.ref))return 'https://www.youtube-nocookie.com/embed/'+t.ref+'?autoplay=1&playsinline=1';
 if(t.kind==='ytl'&&/^[\w-]+$/.test(t.ref))return 'https://www.youtube-nocookie.com/embed/videoseries?list='+t.ref+'&autoplay=1&playsinline=1';
 if(t.kind==='sc'&&/^https:\/\/(on\.)?soundcloud\.com\//.test(t.ref))return 'https://w.soundcloud.com/player/?url='+encodeURIComponent(t.ref)+'&color=%231d9bf0&auto_play=true&hide_related=true&show_comments=false&visual=false';
 return null}
$('mgo').onclick=()=>{
 const st=$('mst'),r=parseLink($('mu').value);
 if(!r){st.textContent='유튜브 또는 사운드클라우드 링크(https://...)를 입력해 주세요.';return}
 const b=$('mgo');b.disabled=true;st.textContent='추가하는 중...';
 addDoc(collection(db,'tracks'),{title:$('mt').value.trim()||'(제목 없음)',kind:r.kind,ref:r.ref,ts:Date.now()})
 .then(()=>{st.textContent='추가했어요.';$('mu').value='';$('mt').value=''}).catch(()=>st.textContent='추가하지 못했어요. 다시 시도해 주세요.').finally(()=>b.disabled=false)};
function renderTracks(){
 const l=$('mlist');l.textContent='';
 if(!tracks.length){l.appendChild(el('div','empty','아직 올라온 영상이 없어요.'));return}
 tracks.forEach(t=>{
  const src=embedOf(t);if(!src)return;
  let node;if(t.kind==='yt'){node=document.createElement('img');node.alt='';node.src='https://i.ytimg.com/vi/'+t.ref+'/mqdefault.jpg'}
  else node=el('div','ph',t.kind==='sc'?'🎧':'▶');
  const toggle=slot=>{const f=document.createElement('iframe');f.className=t.kind==='sc'?'sc':'yt';f.src=src;f.allowFullscreen=true;
   f.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');slot.appendChild(f)};
  const del=isAdmin?()=>deleteDoc(doc(db,'tracks',t.id)).catch(()=>alert('삭제하지 못했어요.')):null;
  l.appendChild(mkItem({node,cls:'wd'},String(t.title||''),fmt(t.ts),toggle,del,true))})}

/* Letters (text + optional photo) */
$('ppick').onclick=()=>$('pf').click();
$('pf').onchange=()=>{const f=$('pf').files[0];$('pname').textContent=f?f.name:''};
function cnt(){const n=bytes($('ptx').value),o=n>200;$('pcnt').textContent=n+' / 200 bytes';$('pcnt').style.color=o?'#e5484d':'';$('pgo').disabled=o}
$('ptx').oninput=cnt;
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
 let max=1000;for(let i=0;i<6;i++){const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',0.8);if(url.length<700000)return res(url);max*=0.8}rej()};im.src=r.result};r.readAsDataURL(file)})}
$('pgo').onclick=()=>{
 const f=$('pf').files[0],tx=$('ptx').value.trim(),st=$('pst');
 if(!f&&!tx){st.textContent='글이나 사진 중 하나는 입력해 주세요.';return}
 if(bytes(tx)>200){st.textContent='글이 200바이트를 넘었어요.';return}
 const b=$('pgo');b.disabled=true;st.textContent='올리는 중...';
 (f?shrink(f):Promise.resolve('')).then(img=>addDoc(collection(db,'letters'),{img,text:tx,ts:Date.now()}))
 .then(()=>{st.textContent='올렸어요.';$('ptx').value='';$('pf').value='';$('pname').textContent=''})
 .catch(()=>st.textContent='올리지 못했어요. 다시 시도해 주세요.').finally(cnt)};
function renderLetters(){
 const l=$('plist');l.textContent='';
 if(!letters.length){l.appendChild(el('div','empty','아직 올라온 글이 없어요.'));return}
 letters.forEach(p=>{
  let thumb=null,toggle=null;
  if(p.img){const im=document.createElement('img');im.alt='';im.src=p.img;thumb={node:im,cls:'sq'};
   toggle=slot=>{const f=document.createElement('img');f.alt='';f.src=p.img;slot.appendChild(f)}}
  const del=isAdmin?()=>deleteDoc(doc(db,'letters',p.id)).catch(()=>alert('삭제하지 못했어요.')):null;
  l.appendChild(mkItem(thumb,String(p.text||(p.img?'(사진)':'')),fmt(p.ts),toggle,del,!!p.img))})}

/* data */
const err=e=>console.error(e);
onSnapshot(query(collection(db,'comments'),orderBy('ts','desc'),limit(300)),s=>{comments=s.docs.map(d=>({id:d.id,...d.data()}));renderDetail()},err);
onSnapshot(collection(db,'replies'),s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());replies=m;renderDetail()},err);
onSnapshot(collection(db,'likes'),s=>{const m={};s.docs.forEach(d=>m[d.id]=1);likes=m;renderDetail()},err);
onSnapshot(query(collection(db,'tracks'),orderBy('ts','desc'),limit(100)),s=>{tracks=s.docs.map(d=>({id:d.id,...d.data()}));renderTracks()},err);
onSnapshot(query(collection(db,'letters'),orderBy('ts','desc'),limit(100)),s=>{letters=s.docs.map(d=>({id:d.id,...d.data()}));renderLetters()},err);
renderDetail();renderTracks();renderLetters();
</script>
</body>
</html>
